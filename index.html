<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0ea5e9">
    
    <!-- ============================================================
         PWA META TAGS — REQUIRED FOR INSTALL PROMPT
         ============================================================ -->
    <meta name="description" content="Self Learners — CSS Preparation Hub">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Self Learners">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Self Learners">
    
    <title>Self Learners · CSS 2027 Hub</title>
    
    <!-- ============================================================
         ICONS + MANIFEST LINK — REQUIRED FOR INSTALL
         ============================================================ -->
    <link rel="icon" type="image/png" 
          href="https://lh3.googleusercontent.com/d/1NRgM5kUkl8A0R5QrklfvdhwYlVj6OY27">
    <link rel="apple-touch-icon" 
          href="https://lh3.googleusercontent.com/d/1NRgM5kUkl8A0R5QrklfvdhwYlVj6OY27">
    <link rel="manifest" id="appManifest">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        :root {
            --navy: #0a1e3f; --navy-light: #1a3a6b; --navy-soft: #e8eef7;
            --black: #0f1419; --black-soft: #1c232b;
            --yellow: #f5b800; --yellow-dark: #d99e00; --yellow-soft: #fff7dd;
            --sky: #0ea5e9; --sky-dark: #0284c7; --sky-soft: #e0f2fe; --sky-light: #7dd3fc;
            --bg: #f4f6fa; --card: #ffffff; --text: #0f1419;
            --text-soft: #475569; --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow-sm: 0 2px 6px rgba(10,30,63,.06);
            --shadow-md: 0 8px 20px -6px rgba(10,30,63,.12);
            --shadow-lg: 0 20px 40px -12px rgba(10,30,63,.18);
            --shadow-xl: 0 30px 60px -15px rgba(10,30,63,.25);
            --radius-full: 9999px; --bottom-nav-h: 68px;
        }
        html { -webkit-text-size-adjust: 100%; }
        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 0% 0%, rgba(14,165,233,.06) 0%, transparent 40%),
                              radial-gradient(circle at 100% 100%, rgba(10,30,63,.05) 0%, transparent 45%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 1rem .75rem 2rem;
            color: var(--text);
            display: flex; justify-content: center;
            font-size: 15px; line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .app-wrapper { max-width: 1560px; width: 100%; }

        .toggle-bar {
            display: flex; gap: 4px; margin-bottom: 16px;
            background: var(--card); padding: 6px;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            position: sticky; top: 8px; z-index: 100;
            backdrop-filter: blur(12px);
        }
        .toggle-btn {
            flex: 1; text-align: center;
            padding: 10px 14px;
            border-radius: var(--radius-full);
            font-weight: 600; font-size: .82rem;
            color: var(--text-soft); background: transparent;
            border: none; cursor: pointer;
            transition: all .22s cubic-bezier(.4,0,.2,1);
            display: flex; align-items: center; justify-content: center;
            gap: 6px; white-space: nowrap; min-height: 40px;
        }
        .toggle-btn .emoji { font-size: .95rem; }
        .toggle-btn:hover { background: var(--sky-soft); color: var(--sky-dark); }
        .toggle-btn.active {
            background: linear-gradient(135deg, var(--sky), var(--sky-dark));
            color: #fff;
            box-shadow: 0 4px 12px rgba(14,165,233,.35);
        }
        .toggle-btn.active .emoji { color: #fff; }

        .page-stage {
            position: relative;
            min-height: calc(100vh - 100px);
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .page-frame {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            border: none; background: transparent;
            opacity: 0; pointer-events: none;
            transition: opacity .25s ease;
        }
        .page-frame.active {
            opacity: 1; pointer-events: auto;
            position: relative;
            min-height: calc(100vh - 100px);
            height: auto;
        }
        .page-loading {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 12px; padding: 4rem 2rem;
            color: var(--text-soft); font-weight: 600;
        }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--sky);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .bottom-nav {
            display: none;
            position: fixed; bottom: 0; left: 0; right: 0;
            height: var(--bottom-nav-h);
            background: rgba(255,255,255,.96);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            box-shadow: 0 -8px 24px rgba(10,30,63,.08);
            z-index: 9000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .bottom-nav-inner {
            display: flex; height: var(--bottom-nav-h);
            justify-content: space-around; max-width: 720px; margin: 0 auto;
        }
        .bottom-nav-btn {
            flex: 1; background: transparent; border: none;
            cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 3px; color: var(--text-muted);
            font-family: inherit; font-weight: 600;
            font-size: .63rem; padding: 8px 4px;
            position: relative; transition: color .2s;
        }
        .bottom-nav-btn .nav-emoji {
            font-size: 1.3rem; transition: transform .22s cubic-bezier(.34,1.56,.64,1);
        }
        .bottom-nav-btn.active { color: var(--sky-dark); }
        .bottom-nav-btn.active .nav-emoji {
            transform: translateY(-3px) scale(1.1);
            filter: drop-shadow(0 3px 6px rgba(14,165,233,.4));
        }
        .bottom-nav-btn.active::before {
            content: ''; position: absolute; top: 0;
            left: 50%; transform: translateX(-50%);
            width: 32px; height: 3px;
            border-radius: 0 0 4px 4px;
            background: var(--sky);
        }

        /* PWA install banner on hub page */
        .hub-install-banner {
            position: fixed; bottom: 1.2rem; left: 50%;
            transform: translateX(-50%) translateY(200%);
            background: var(--card);
            border-radius: 20px;
            padding: 1.1rem 1.4rem;
            display: flex; align-items: center; gap: 1rem;
            z-index: 9998; max-width: 460px; width: calc(100% - 2rem);
            border: 2px solid var(--sky);
            transition: transform .45s cubic-bezier(.16,1,.3,1);
            box-shadow: 0 30px 60px -15px rgba(14,165,233,.35), 0 0 0 4px rgba(14,165,233,.08);
        }
        .hub-install-banner.show { transform: translateX(-50%) translateY(0); }
        .hub-install-banner .ib-icon {
            width: 52px; height: 52px; border-radius: 14px;
            background: linear-gradient(135deg, var(--sky), var(--sky-dark));
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; overflow: hidden;
            box-shadow: 0 6px 16px -4px rgba(14,165,233,.5);
        }
        .hub-install-banner .ib-icon img { width: 100%; height: 100%; object-fit: cover; }
        .hub-install-banner .ib-text { flex: 1; min-width: 0; }
        .hub-install-banner .ib-text strong {
            display: block; font-size: .95rem; font-weight: 800;
            color: var(--navy); margin-bottom: .2rem;
        }
        .hub-install-banner .ib-text span { font-size: .78rem; color: var(--text-soft); line-height: 1.35; display: block; }
        .hub-install-banner .ib-btn {
            background: linear-gradient(135deg, var(--sky), var(--sky-dark));
            color: #fff; border: none; font-weight: 800;
            font-size: .85rem; padding: .7rem 1.3rem;
            border-radius: var(--radius-full); cursor: pointer; font-family: inherit;
            box-shadow: 0 4px 12px -4px rgba(14,165,233,.6);
            white-space: nowrap;
        }
        .hub-install-banner .ib-close {
            background: 0 0; border: none; font-size: 1.1rem;
            color: var(--text-muted); cursor: pointer; padding: .3rem;
            border-radius: 50%; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
        }

        @media (max-width: 768px) {
            .toggle-bar { display: none; }
            .bottom-nav { display: block; }
            body { padding: .6rem .6rem calc(var(--bottom-nav-h) + env(safe-area-inset-bottom) + 16px); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="toggle-bar" id="topToggleBar">
        <button class="toggle-btn active" data-page="edu" data-src="page-edu.html">
            <span class="emoji">🎓</span> Edu
        </button>
        <button class="toggle-btn" data-page="schedule" data-src="page-schedule.html">
            <span class="emoji">📅</span> Schedule
        </button>
        <button class="toggle-btn" data-page="syllabus" data-src="page-syllabus.html">
            <span class="emoji">📋</span> Syllabus
        </button>
        <button class="toggle-btn" data-page="papers" data-src="page-papers.html">
            <span class="emoji">📄</span> Papers
        </button>
        <button class="toggle-btn" data-page="eligibility" data-src="page-eligibility.html">
            <span class="emoji">🛡️</span> Eligibility
        </button>
    </div>

    <div class="page-stage" id="pageStage"></div>
</div>

<!-- ============================================================
     PWA INSTALL BANNER
     ============================================================ -->
<div class="hub-install-banner" id="hubInstallBanner">
    <div class="ib-icon">
        <img src="https://lh3.googleusercontent.com/d/1NRgM5kUkl8A0R5QrklfvdhwYlVj6OY27" alt="SL" onerror="this.parentElement.textContent='SL'">
    </div>
    <div class="ib-text">
        <strong>📲 Install Self Learners App</strong>
        <span>Get quick access &amp; work offline — tap Install to add to your home screen.</span>
    </div>
    <button class="ib-btn" id="hubInstallBtn">Install</button>
    <button class="ib-close" id="hubInstallClose">✕</button>
</div>

<nav class="bottom-nav" id="bottomNav" role="navigation">
    <div class="bottom-nav-inner">
        <button class="bottom-nav-btn active" data-page="edu" data-src="page-edu.html">
            <span class="nav-emoji">🎓</span>
            <span class="nav-label">Edu</span>
        </button>
        <button class="bottom-nav-btn" data-page="schedule" data-src="page-schedule.html">
            <span class="nav-emoji">📅</span>
            <span class="nav-label">Schedule</span>
        </button>
        <button class="bottom-nav-btn" data-page="syllabus" data-src="page-syllabus.html">
            <span class="nav-emoji">📋</span>
            <span class="nav-label">Syllabus</span>
        </button>
        <button class="bottom-nav-btn" data-page="papers" data-src="page-papers.html">
            <span class="nav-emoji">📄</span>
            <span class="nav-label">Papers</span>
        </button>
        <button class="bottom-nav-btn" data-page="eligibility" data-src="page-eligibility.html">
            <span class="nav-emoji">🛡️</span>
            <span class="nav-label">Eligibility</span>
        </button>
    </div>
</nav>

<script>
/* ============================================================
   PWA SETUP — REQUIRED FOR INSTALL PROMPT
   This block is what makes the app installable!
   ============================================================ */
(function setupPWA() {
    const LOGO = 'https://lh3.googleusercontent.com/d/1NRgM5kUkl8A0R5QrklfvdhwYlVj6OY27';
    const APP_NAME = 'Self Learners';
    
    // ---- 1. Create and attach the Web App Manifest (as a Blob) ----
    const manifest = {
        name: APP_NAME,
        short_name: 'Self Learners',
        description: 'CSS Preparation Hub — MCQs, Syllabus, Papers, Schedule',
        start_url: './index.html',
        scope: './',
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#f4f6fa',
        theme_color: '#0ea5e9',
        categories: ['education', 'productivity'],
        icons: [
            { src: LOGO, sizes: '192x192', type: 'image/png', purpose: 'any' },
            { src: LOGO, sizes: '512x512', type: 'image/png', purpose: 'any' },
            { src: LOGO, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
            { src: LOGO, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
        ],
        shortcuts: [
            { name: 'Edu — Quiz', url: './page-edu.html', description: 'Jump into MCQ quiz' },
            { name: 'Schedule', url: './page-schedule.html', description: 'View daily schedule' },
            { name: 'Syllabus', url: './page-syllabus.html', description: 'Browse CSS syllabus' }
        ]
    };
    
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    document.getElementById('appManifest').href = URL.createObjectURL(manifestBlob);
    
    // ---- 2. Register a minimal Service Worker (Blob-based) ----
    // Chrome/Firefox REQUIRE a registered service worker for install prompt.
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE = 'sl-shell-v1';
            self.addEventListener('install', (e) => {
                self.skipWaiting();
            });
            self.addEventListener('activate', (e) => {
                e.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', (e) => {
                // Network-first for Google Sheets (always fresh data)
                if (e.request.url.includes('docs.google.com')) {
                    e.respondWith(
                        fetch(e.request).catch(() => caches.match(e.request))
                    );
                    return;
                }
                // Cache-first for everything else
                e.respondWith(
                    caches.match(e.request).then((cached) => {
                        return cached || fetch(e.request).then((response) => {
                            const clone = response.clone();
                            caches.open(CACHE).then((c) => c.put(e.request, clone));
                            return response;
                        }).catch(() => cached);
                    })
                );
            });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        
        navigator.serviceWorker.register(swUrl, { scope: './' })
            .then((reg) => console.log('✅ Service Worker registered:', reg.scope))
            .catch((err) => console.warn('⚠️ SW registration failed:', err));
    }
    
    // ---- 3. Install prompt handling ----
    let deferredPrompt = null;
    const banner = document.getElementById('hubInstallBanner');
    const installBtn = document.getElementById('hubInstallBtn');
    const installClose = document.getElementById('hubInstallClose');
    const KEY_DISMISSED = 'slInstallDismissed';
    
    function shouldShowBanner() {
        try {
            const dismissed = localStorage.getItem(KEY_DISMISSED);
            if (!dismissed) return true;
            // Re-show after 24 hours
            const dayMs = 24 * 60 * 60 * 1000;
            return (Date.now() - parseInt(dismissed, 10)) > dayMs;
        } catch (e) { return true; }
    }
    
    function showBanner() {
        if (banner) banner.classList.add('show');
    }
    function hideBanner(persist) {
        if (banner) banner.classList.remove('show');
        if (persist) {
            try { localStorage.setItem(KEY_DISMISSED, String(Date.now())); } catch (e) {}
        }
    }
    
    // Capture the native install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('✅ beforeinstallprompt fired — app is installable!');
        if (shouldShowBanner()) showBanner();
    });
    
    // Handle install button click
    if (installBtn) {
        installBtn.onclick = async () => {
            if (deferredPrompt) {
                // Native prompt available (Chrome/Edge/Samsung)
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('✅ User installed the app');
                    hideBanner(true);
                } else {
                    console.log('❌ User dismissed install');
                }
                deferredPrompt = null;
            } else {
                // Fallback: show device-specific instructions
                const ua = navigator.userAgent || '';
                const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
                const isAndroid = /Android/.test(ua);
                let msg = '📲 To install:\n\n';
                if (isIOS) {
                    msg += '1. Tap the Share button (⬆️)\n2. Scroll down\n3. Tap "Add to Home Screen"\n4. Tap "Add"';
                } else if (isAndroid) {
                    msg += '1. Tap the ⋮ menu in Chrome\n2. Tap "Install app" or "Add to Home Screen"\n3. Confirm install';
                } else {
                    msg += '1. Look for the install icon in the address bar\n2. Or use browser menu → "Install App"';
                }
                alert(msg);
            }
        };
    }
    
    if (installClose) {
        installClose.onclick = () => hideBanner(true);
    }
    
    // Show banner on page load if not dismissed
    window.addEventListener('load', () => {
        if (shouldShowBanner()) {
            // Delay 2 seconds for smooth UX
            setTimeout(() => {
                // Show banner even if beforeinstallprompt hasn't fired (in case browser is slow)
                showBanner();
            }, 2000);
        }
    });
    
    // Hide banner if app is already installed (standalone mode)
    window.addEventListener('appinstalled', () => {
        console.log('🎉 App installed successfully!');
        hideBanner(true);
    });
    
    if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
        // Already installed — hide banner permanently
        if (banner) banner.style.display = 'none';
    }
})();

/* ============================================================
   PAGE NAVIGATION (iframes)
   ============================================================ */
(function () {
    const stage = document.getElementById('pageStage');
    const topButtons = document.querySelectorAll('.toggle-btn');
    const bottomButtons = document.querySelectorAll('.bottom-nav-btn');
    const frames = new Map();
    let activePage = null;

    const THEME = {
        navy: '#0a1e3f', navyLight: '#1a3a6b', navySoft: '#e8eef7',
        black: '#0f1419', yellow: '#f5b800', yellowDark: '#d99e00',
        yellowSoft: '#fff7dd', sky: '#0ea5e9', skyDark: '#0284c7', skySoft: '#e0f2fe',
        bg: '#f4f6fa', card: '#ffffff',
        text: '#0f1419', textSoft: '#475569', textMuted: '#94a3b8',
        border: '#e2e8f0',
        success: '#059669', danger: '#dc2626', warning: '#d97706', info: '#0284c7'
    };

    function showPage(pageId, src) {
        if (activePage === pageId) return;
        activePage = pageId;

        topButtons.forEach(b => b.classList.toggle('active', b.dataset.page === pageId));
        bottomButtons.forEach(b => b.classList.toggle('active', b.dataset.page === pageId));

        if (!frames.has(pageId)) {
            const wrap = document.createElement('div');
            wrap.className = 'page-frame';
            wrap.style.position = 'relative';
            wrap.style.minHeight = 'calc(100vh - 100px)';
            wrap.style.opacity = '0';
            wrap.style.pointerEvents = 'none';
            wrap.dataset.pageId = pageId;

            const loader = document.createElement('div');
            loader.className = 'page-loading';
            loader.innerHTML = '<div class="spinner"></div><span>Loading…</span>';

            const iframe = document.createElement('iframe');
            iframe.src = src;
            iframe.title = 'Self Learners · ' + pageId;
            iframe.setAttribute('loading', 'lazy');
            iframe.style.cssText = 'width:100%;min-height:calc(100vh - 100px);border:none;display:block;background:transparent;';

            wrap.appendChild(loader);
            wrap.appendChild(iframe);
            stage.appendChild(wrap);

            iframe.addEventListener('load', () => {
                try {
                    iframe.contentWindow.postMessage({ type: 'SL_THEME', theme: THEME }, '*');
                } catch (e) {}
                wrap.style.opacity = '1';
                wrap.style.pointerEvents = 'auto';
                loader.style.display = 'none';
            });

            setTimeout(() => {
                if (loader.style.display !== 'none') {
                    wrap.style.opacity = '1';
                    wrap.style.pointerEvents = 'auto';
                    loader.style.display = 'none';
                }
            }, 3000);

            frames.set(pageId, wrap);
        }

        frames.forEach((wrap, id) => {
            const isActive = id === pageId;
            wrap.classList.toggle('active', isActive);
            wrap.style.opacity = isActive ? '1' : '0';
            wrap.style.pointerEvents = isActive ? 'auto' : 'none';
            wrap.style.position = isActive ? 'relative' : 'absolute';
            wrap.style.display = isActive ? 'block' : 'none';
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    topButtons.forEach(btn => {
        btn.addEventListener('click', () => showPage(btn.dataset.page, btn.dataset.src));
    });
    bottomButtons.forEach(btn => {
        btn.addEventListener('click', () => showPage(btn.dataset.page, btn.dataset.src));
    });

    showPage('edu', 'page-edu.html');
    window.__showPage = showPage;
})();
</script>
</body>
</html>
